[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-scraper"
version = "0.95"
description = "YouTube news channel monitoring — scraping, analytics, and web dashboard"
readme = "README.md"
authors = [
    { name = "Oleksii" }
]
requires-python = ">=3.9"
dependencies = [
    "yt-dlp",
    "requests",
    "kagglehub",
    "kagglesdk",
    "psycopg2-binary",
    "flask"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["news_scraper", "news_scraper.*"]
